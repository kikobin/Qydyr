# Manual curation on top of OpenStreetMap, matched by place name in any spelling.
# Aliases are what people actually say ("я у Чупа-чупса") and what afishas write.
# Keep aliases specific: a short generic alias like "Мега" would grab unrelated places.
# attrs feed the assistant's knowledge (view, interactive, ...), shown as data, not as guesses.

