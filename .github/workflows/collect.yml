name: collect data

# Places (OpenStreetMap) once a day, events every 6 hours.
# Repo secrets: DATABASE_URL (Supabase session pooler URI), ANTHROPIC_API_KEY, QYDYR_DGIS_KEY (2ГИС, optional).
on:
  schedule:
    - cron: "41 1 * * *"     # 06:41 Astana — places + events
    - cron: "17 */6 * * *"   # events
    - cron: "23 2 * * 1"     # Mondays — 2ГИС: a key has a quota (a demo key is blocked after ~1000 requests)
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # no DATABASE_URL secret yet (a fresh fork or repo): skip quietly instead of failing every 6 hours
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.s.outputs.ready }}
    steps:
      - id: s
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: echo "ready=$([ -n "$DATABASE_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  collect:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QYDYR_DGIS_KEY: ${{ secrets.QYDYR_DGIS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (fast, no network)
        run: python -m pytest -q
      - name: Schema (idempotent)
        run: python -m qydyr_data init-db
      - name: Places
        if: github.event.schedule == '41 1 * * *' || github.event_name == 'workflow_dispatch'
        run: python -m qydyr_data places
      - name: Events
        run: python -m qydyr_data events
      - name: 2ГИС (hours, ratings, Wi-Fi, step-free entrances, places OSM lacks)
        if: env.QYDYR_DGIS_KEY != '' && (github.event.schedule == '23 2 * * 1' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: python -m qydyr_data dgis --limit 200
      - name: City audit (where typical requests find nothing nearby)
        run: python -m qydyr_data audit
      - name: Report
        if: always()
        run: |
          python -m qydyr_data stats
          python -m qydyr_data unmatched
      - name: Brief scenarios on fresh data
        if: always()
        continue-on-error: true
        run: python -m qydyr_data eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-${{ github.run_id }}
          path: data/out/
          retention-days: 7
