# The brief's five scenarios + the example, on real data (live weather, current time).
# Only rules that must hold anywhere are checked here: run `python -m qydyr_data eval` after `events`.
scenarios:
  - id: brief_1_mega_walk
    text: "Я сейчас возле Mega Silk Way, хочу прогуляться 30–60 минут — что посоветуете?"
    expect: {anchor_contains: "Mega", min_items: 1}

  - id: brief_2_quiet_coffee_socket
    text: "Хочу тихое место с кофе и розеткой недалеко от меня."
    lat: 51.0900
    lon: 71.4165
    expect: {min_items: 1}

  - id: brief_3_kids
    text: "Еду с ребёнком — где рядом есть детские площадки или музей с интерактивами?"
    lat: 51.0900
    lon: 71.4165
    expect: {no_subcategories: [bar, pub, nightclub]}

  - id: brief_4_tourist_flight
    text: "Я - турист, у меня 2 часа перед вылетом: что можно посмотреть поблизости?"
    lat: 51.1283
    lon: 71.4305
    expect: {note_contains: "свободного времени"}

  - id: brief_5_night
    text: "Ищу необычную ночную активность (последние пару часов)."
    lat: 51.0900
    lon: 71.4165

  - id: brief_example_expo
    text: "Я у здании Экспо 2017, хочу что-то необычное на 1–2 часа, пешком."
    expect: {anchor_contains: "EXPO"}   # in OpenStreetMap the Nur Alem sphere is named "EXPO"

  # Places people name in their own words (the review on real data): case forms, Kazakh, OSM copies.
  - id: anchor_mega_with_kid
    text: "я у Mega Silk Way с ребёнком 5 лет, есть 2 часа"
    expect: {anchor_contains: "Mega"}

  - id: anchor_pyramid_case
    text: "я у Пирамиды, что посмотреть рядом?"
    expect: {anchor_contains: "Бейбітшілік", min_items: 1}

  - id: anchor_national_museum_case
    text: "я у Национального музея, есть 2 часа"
    expect: {anchor_contains: "Мұражай", min_items: 1}

  - id: anchor_kazakh_postposition
    text: "Бәйтерек жанындамын, бір сағат бар"
    expect: {anchor_contains: "Бәйтерек", min_items: 1}

  - id: anchor_after_another_preposition
    text: "хочу на концерт, я у Байтерека"
    expect: {anchor_contains: "Бәйтерек"}

  - id: flight_from_mega_to_nqz
    text: "я в Мега Силк Уэй, до вылета 2 часа"
    expect: {anchor_contains: "Mega", note_contains: "дорога в аэропорт ~2"}
